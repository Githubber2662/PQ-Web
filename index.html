<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PlatinumQuest Mobile</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(12, 20, 30, 0.72);
        --accent: #7ef0ff;
        --text: #edf7ff;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #09131d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        touch-action: none;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }

      .panel {
        background: var(--panel-bg);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .stats {
        padding: 10px 14px;
        min-width: 140px;
      }

      .stats .label,
      .status .label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(237,247,255,0.7);
      }

      .stats .value,
      .status .value {
        display: block;
        margin-top: 4px;
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
      }

      .status {
        padding: 10px 14px;
        min-width: 170px;
        text-align: right;
      }

      .status .value {
        color: var(--accent);
      }

      .touch-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(18px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
        z-index: 20;
        padding: 0 14px;
      }

      .left-cluster,
      .right-cluster {
        display: flex;
        align-items: center;
        pointer-events: auto;
      }

      .control-button {
        user-select: none;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50%;
        background: rgba(11, 20, 29, 0.62);
        color: white;
        font-size: 28px;
        font-weight: 700;
        box-shadow: 0 10px 20px rgba(0,0,0,0.22);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .control-button:active {
        transform: scale(0.97);
      }

      .control-button + .control-button {
        margin-left: 10px;
      }

      .jump-button {
        width: 78px;
        height: 78px;
        background: rgba(126, 240, 255, 0.16);
        border-color: rgba(126, 240, 255, 0.5);
        color: var(--accent);
      }

      .touch-hint {
        position: absolute;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        background: rgba(9, 18, 29, 0.55);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 8px 12px;
        color: rgba(237,247,255,0.82);
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        z-index: 15;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="touch-hint">Move and jump</div>

      <div class="hud">
        <div class="panel stats">
          <span class="label">Gems</span>
          <span id="gems-value" class="value">0 / 0</span>
        </div>

        <div class="panel status">
          <span class="label">Status</span>
          <span id="status-value" class="value">Ready</span>
        </div>
      </div>

      <div class="touch-controls">
        <div class="left-cluster">
          <button class="control-button" data-input="left" aria-label="Move left">◀</button>
          <button class="control-button" data-input="right" aria-label="Move right">▶</button>
        </div>

        <div class="right-cluster">
          <button class="control-button jump-button" data-input="jump" aria-label="Jump">⤒</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
